<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Downloader Pro Free</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1e293b;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: #10b981;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
    }
    .version {
      font-size: 11px;
      color: #94a3b8;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      font-size: 13px;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #475569;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(16px); }
    .status-box {
      background: #0f172a;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #38bdf8;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">DPF</div>
    <div>
      <div class="title">Downloader Pro Free</div>
      <div class="version">Extension v1.0.0</div>
    </div>
  </div>

  <div class="toggle-row">
    <span>Intercept Downloads</span>
    <label class="switch">
      <input type="checkbox" id="interceptToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="toggle-row">
    <span>Video Grabber Button</span>
    <label class="switch">
      <input type="checkbox" id="grabberToggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-box">
    Connected to DPF Desktop Engine
  </div>

  <script src="popup.js"></script>
</body>
</html>
